# TRACE — local stack.
#
#   docker compose up --build        # frontend only (works today, mock-data mode)
#   open http://localhost:3000
#
# Switch the frontend to a real backend (values are baked in at BUILD time, so rebuild):
#   VITE_API_MODE=http VITE_API_BASE_URL=http://localhost:8000/api/v1 docker compose up --build
#
# Layout this file assumes once the team's code is cloned next to the frontend:
#   TRACE Final Year Project/
#     trace-frontend/   <- this repo (this file lives here)
#     trace-backend/    <- friends' FastAPI repo (clone it here)
#     trace-fabric/     <- Hyperledger Fabric network / chaincode (when it exists)

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    image: trace-frontend:local
    container_name: trace-frontend
    ports:
      - "3000:8080"
    restart: unless-stopped
    # Wait for the API before starting once it is enabled below:
    # depends_on:
    #   backend:
    #     condition: service_healthy

  # ---------------------------------------------------------------------------------------------

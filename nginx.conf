# nginx config for the TRACE single-page app (React Router, BrowserRouter).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Basic hardening headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Liveness probe used by the Docker HEALTHCHECK / compose.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite emits content-hashed filenames under /assets, so they can be cached for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html must never be cached, or users keep loading old bundle names after a deploy.
  # (add_header in a location replaces the server-level ones, so the security headers repeat here.)
  location = /index.html {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # SPA fallback: deep links such as /cases/TRC-2026-0114 and page refreshes are served
  # index.html and routed by React Router in the browser.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
